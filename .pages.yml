# Pages CMS config for this site.
#
# Home is the content-blocks experiment: its editable copy lives in the page's
# YAML front matter as a list of typed `sections` blocks, so the CMS renders a
# block editor (strings + rich text) instead of raw HTML. Everything else stays
# a raw code editor over the actual template file.
#
# settings.content.merge keeps the rest of index.html (layout/nav/active keys
# and the HTML body) intact when the Home entry is saved.
settings:
  content:
    merge: true

media: src/images

content:
  - name: pages
    label: Pages
    type: group
    items:
      - name: page-home
        label: Home
        type: file
        path: src/pages/index.html
        format: yaml-frontmatter
        fields:
          - name: title
            label: Browser title
            type: string
          - name: sections
            label: Content blocks
            type: block
            list: true
            blockKey: type
            blocks:
              - name: welcome
                label: Welcome section
                fields:
                  - name: label
                    label: Eyebrow label
                    type: string
                  - name: heading
                    label: Heading
                    type: string
                  - name: headingAccent
                    label: Heading (highlighted part)
                    type: string
                  - name: intro
                    label: Intro paragraphs
                    type: rich-text
                    options:
                      format: markdown
                      media: false
                  - name: quote
                    label: Pull quote
                    type: text
                  - name: values
                    label: Values
                    type: object
                    list: true
                    fields:
                      - name: icon
                        type: select
                        options:
                          values: [heart, target, shield, star]
                      - name: title
                        type: string
                      - name: text
                        type: string
          - name: body
            label: Page HTML (advanced)
            type: code
            options:
              format: html
      - name: page-join
        label: Join
        type: file
        path: src/pages/join.html
        format: code
      - name: page-calendar
        label: Calendar
        type: file
        path: src/pages/calendar.html
        format: code

  - name: templates
    label: Templates
    type: group
    items:
      - name: tpl-base
        label: Base layout (head, body shell)
        type: file
        path: src/_includes/base.html
        format: code
      - name: tpl-header
        label: Header + mobile menu
        type: file
        path: src/_includes/header.html
        format: code
      - name: tpl-footer
        label: Footer
        type: file
        path: src/_includes/footer.html
        format: code
      - name: tpl-scripts
        label: Shared scripts
        type: file
        path: src/_includes/scripts.html
        format: code
